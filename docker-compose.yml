version: '3.8'

services:
  cineo:
    build: .
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_WS_URL=ws://localhost:3001
      - WS_PORT=3001
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    restart: unless-stopped

